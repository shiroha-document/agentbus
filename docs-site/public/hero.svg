<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" fill="none">
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4f5df"/><stop offset="1" stop-color="#2ea477"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3f6ed"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#174d3a"/><stop offset="1" stop-color="#0c3326"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be8c8"/><stop offset="1" stop-color="#3fb98a"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3fb98a" stop-opacity="0.28"/><stop offset="0.65" stop-color="#3fb98a" stop-opacity="0.08"/><stop offset="1" stop-color="#3fb98a" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f3b2c" flood-opacity="0.18"/></filter>
  </defs>

  <circle cx="210" cy="210" r="200" fill="url(#halo)"/>
  <circle cx="210" cy="210" r="150" stroke="#3fb98a" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 7"/>
  <circle cx="210" cy="210" r="104" stroke="#3fb98a" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- wires -->
  <g stroke="url(#wire)" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M210 210 L210 74"/>
    <path d="M210 210 L338 156"/>
    <path d="M210 210 L326 318"/>
    <path d="M210 210 L94 318"/>
    <path d="M210 210 L82 156"/>
  </g>
  <!-- message dots travelling on wires -->
  <g fill="#3fb98a">
    <circle cx="210" cy="120" r="5"/>
    <circle cx="290" cy="176" r="4.5" opacity="0.8"/>
    <circle cx="140" cy="273" r="4.5" opacity="0.8"/>
  </g>
  <g fill="#9be8c8">
    <circle cx="270" cy="265" r="4"/>
    <circle cx="130" cy="176" r="4"/>
  </g>

  <!-- hub core -->
  <g filter="url(#soft)">
    <rect x="160" y="160" width="100" height="100" rx="30" fill="url(#core)"/>
    <path d="M186 222c7 6.4 14 9.6 24 9.6s17-3.2 24-9.6" stroke="#0f3b2c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="191" cy="196" r="5.5" fill="#0f3b2c"/>
    <circle cx="229" cy="196" r="5.5" fill="#0f3b2c"/>
  </g>

  <!-- agent nodes: little terminals -->
  <g filter="url(#soft)">
    <g transform="translate(176 36)">
      <rect width="68" height="54" rx="14" fill="url(#node)" stroke="#d3ece1" stroke-width="2"/>
      <rect x="9" y="9" width="50" height="30" rx="7" fill="url(#screen)"/>
      <path d="M17 19 l6 5 -6 5" stroke="#9be8c8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 29 h12" stroke="#9be8c8" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="34" cy="46" r="2.5" fill="#3fb98a"/>
    </g>
    <g transform="translate(316 122)">
      <rect width="68" height="54" rx="14" fill="url(#node)" stroke="#d3ece1" stroke-width="2"/>
      <rect x="9" y="9" width="50" height="30" rx="7" fill="url(#screen)"/>
      <path d="M17 19 h28 M17 26 h20 M17 33 h24" stroke="#9be8c8" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
      <circle cx="34" cy="46" r="2.5" fill="#3fb98a"/>
    </g>
    <g transform="translate(296 290)">
      <rect width="68" height="54" rx="14" fill="url(#node)" stroke="#d3ece1" stroke-width="2"/>
      <rect x="9" y="9" width="50" height="30" rx="7" fill="url(#screen)"/>
      <path d="M22 24 l6 6 12-12" stroke="#9be8c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="34" cy="46" r="2.5" fill="#3fb98a"/>
    </g>
    <g transform="translate(56 290)">
      <rect width="68" height="54" rx="14" fill="url(#node)" stroke="#d3ece1" stroke-width="2"/>
      <rect x="9" y="9" width="50" height="30" rx="7" fill="url(#screen)"/>
      <circle cx="26" cy="24" r="4" fill="#9be8c8"/><circle cx="42" cy="24" r="4" fill="#9be8c8" opacity="0.6"/>
      <circle cx="34" cy="46" r="2.5" fill="#3fb98a"/>
    </g>
    <!-- human: a browser card -->
    <g transform="translate(36 122)">
      <rect width="72" height="58" rx="14" fill="url(#node)" stroke="#d3ece1" stroke-width="2"/>
      <circle cx="13" cy="12" r="2.6" fill="#9be8c8"/><circle cx="21" cy="12" r="2.6" fill="#d3ece1"/><circle cx="29" cy="12" r="2.6" fill="#d3ece1"/>
      <circle cx="22" cy="35" r="9" fill="#9be8c8"/>
      <path d="M36 31 h24 M36 39 h16" stroke="#3fb98a" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- sparkles -->
  <path d="M352 64 c1.3 6 1.3 6 7.3 7.3 c-6 1.3-6 1.3-7.3 7.3 c-1.3-6-1.3-6-7.3-7.3 c6-1.3 6-1.3 7.3-7.3z" fill="#3fb98a" opacity="0.6"/>
  <path d="M64 70 c0.9 4.1 0.9 4.1 5 5 c-4.1 0.9-4.1 0.9-5 5 c-0.9-4.1-0.9-4.1-5-5 c4.1-0.9 4.1-0.9 5-5z" fill="#3fb98a" opacity="0.45"/>
  <path d="M206 372 c1 4.6 1 4.6 5.6 5.6 c-4.6 1-4.6 1-5.6 5.6 c-1-4.6-1-4.6-5.6-5.6 c4.6-1 4.6-1 5.6-5.6z" fill="#3fb98a" opacity="0.5"/>
  <circle cx="380" cy="250" r="3" fill="#9be8c8"/>
  <circle cx="34" cy="250" r="2.5" fill="#3fb98a" opacity="0.4"/>
</svg>
