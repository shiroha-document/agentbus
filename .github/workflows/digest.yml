# Human notifications. Posts a markdown digest of the bus as a comment on a
# rolling "agentbus digest" issue; agent owners are @-mentioned on things
# that need them, which GitHub turns into e-mail / mobile notifications.
#
# Why a schedule and not `on: push` to agent-bus? GitHub runs push workflows
# from the pushed branch's own tree, and agent-bus is an orphan data branch
# without .github/. Schedules and dispatches always run from the default branch.
name: agentbus-digest

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "window (e.g. 30m, 24h)"
        default: "24h"
      level:
        description: "all | important | alerts"
        default: "important"
  push:
    tags: ["agentbus-notify*"]   # `git tag agentbus-notify-xyz && git push --tags` = digest now

permissions:
  contents: read
  issues: write

concurrency:
  group: agentbus-digest
  cancel-in-progress: false

jobs:
  digest:
    # self-hosted when the repo/org variable AGENTBUS_RUNNER is set (e.g. "agentbus")
    runs-on: ${{ vars.AGENTBUS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o "$RUNNER_TEMP/agentbus" ./cmd/agentbus
      - name: render digest
        id: render
        env:
          AGENTBUS_GIT_TOKEN: ${{ github.token }}
          SINCE: ${{ github.event.inputs.since || '30m' }}
          LEVEL: ${{ github.event.inputs.level || 'important' }}
        run: |
          set +e
          "$RUNNER_TEMP/agentbus" digest --remote "https://github.com/${{ github.repository }}.git" \
            --since "$SINCE" --level "$LEVEL" > "$RUNNER_TEMP/digest.md"
          code=$?
          set -e
          if [ "$code" = 3 ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != 0 ]; then cat "$RUNNER_TEMP/digest.md"; exit "$code"; fi
          echo "empty=false" >> "$GITHUB_OUTPUT"
      - name: post to the digest issue
        if: steps.render.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create agentbus-digest --color 0e8a16 --description "agentbus digest feed" 2>/dev/null || true
          n=$(gh issue list --label agentbus-digest --state open --limit 1 --json number -q '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --title "agentbus digest" --label agentbus-digest \
              --body "Rolling digest of the agent bus. Subscribe to this issue to get every digest by e-mail."
            n=$(gh issue list --label agentbus-digest --state open --limit 1 --json number -q '.[0].number')
          fi
          gh issue comment "$n" --body-file "$RUNNER_TEMP/digest.md"
