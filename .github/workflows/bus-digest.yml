# Reusable: human notifications for an agentbus *bus repo*.
#
# Posts a markdown digest of the bus as a comment on a rolling "agentbus
# digest" issue in the calling repo; agent owners are @-mentioned on things
# that need them, which GitHub turns into e-mail / mobile notifications.
# Caller: deploy/bus-repo/.github/workflows/digest.yml.
name: agentbus-bus-digest

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      agentbus-version:
        type: string
        default: latest
      since:
        description: "window (e.g. 30m, 24h)"
        type: string
        default: 30m
      level:
        description: "all | important | alerts"
        type: string
        default: important

jobs:
  digest:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: install agentbus
        env:
          AGENTBUS_VERSION: ${{ inputs.agentbus-version }}
          AGENTBUS_BIN: ${{ runner.temp }}/bin
        run: curl -fsSL https://raw.githubusercontent.com/shiroha-document/agentbus/main/install.sh | sh
      - name: render digest
        id: render
        env:
          AGENTBUS_GIT_TOKEN: ${{ github.token }}
          AGENTBUS_HOME: ${{ runner.temp }}/agentbus-home
          SINCE: ${{ inputs.since }}
          LEVEL: ${{ inputs.level }}
        run: |
          set +e
          "$RUNNER_TEMP/bin/agentbus" digest --remote "https://github.com/${{ github.repository }}.git" \
            --since "$SINCE" --level "$LEVEL" > "$RUNNER_TEMP/digest.md"
          code=$?
          set -e
          if [ "$code" = 3 ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != 0 ]; then cat "$RUNNER_TEMP/digest.md"; exit "$code"; fi
          echo "empty=false" >> "$GITHUB_OUTPUT"
      - name: post to the digest issue
        if: steps.render.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create agentbus-digest --color 0e8a16 --description "agentbus digest feed" 2>/dev/null || true
          n=$(gh issue list --label agentbus-digest --state open --limit 1 --json number -q '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --title "agentbus digest" --label agentbus-digest \
              --body "Rolling digest of the agent bus. Subscribe to this issue to get every digest by e-mail."
            n=$(gh issue list --label agentbus-digest --state open --limit 1 --json number -q '.[0].number')
          fi
          gh issue comment "$n" --body-file "$RUNNER_TEMP/digest.md"
