name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # This repo is public: GitHub-hosted runners are free here, and it must
    # never run on the self-hosted runner (that would let any PR execute code
    # on the host). macOS only runs for release tags.
    strategy:
      matrix:
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["linux","macos-latest"]' || '["linux"]') }}
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-latest' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          go test -count=1 ./...
