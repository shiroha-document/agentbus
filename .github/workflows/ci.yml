name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # This repo is public: GitHub-hosted runners are free here, and it must
    # never run on the self-hosted runner (that would let any PR execute code
    # on the host). Mac is the primary client platform; Linux and Windows are supported.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      # New user-facing print literals in cmd/ must go through i18n.Pick.
      - if: runner.os == 'Linux'
        run: python3 scripts/check-cli-i18n.py --strict
      # install.ps1 must stay parseable on Windows PowerShell 5.1 (pwsh on the
      # Windows runner covers PowerShell 7; 5.1 ships with the runner image).
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors; exit 1 }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors; exit 1 }
