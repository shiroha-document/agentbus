name: hub
on:
  push:
    branches: [main]
    paths: ["hub/**", ".github/workflows/hub.yml"]
  pull_request:
    paths: ["hub/**", ".github/workflows/hub.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: false

# Public repo: GitHub-hosted runners only. Deploy jobs run only on push to main of this repo,
# so fork PRs never see the Cloudflare secrets.
defaults:
  run:
    working-directory: hub

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hub/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter worker test
      - run: pnpm --filter web test
      - run: pnpm build
      - run: pnpm --filter worker exec wrangler deploy --env production --dry-run --outdir /tmp/dry
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: hub/web/dist
          retention-days: 3

  gate:
    # Deploys are skipped (not failed) until the CI token secret exists.
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'shiroha-document/agentbus'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.g.outputs.deploy }}
    steps:
      - id: g
        working-directory: .
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "deploy=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          [ "$HAS_TOKEN" = true ] || echo "::warning::CLOUDFLARE_API_TOKEN not set; skipping deploy"

  staging:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hub/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: hub/web/dist
      - name: migrate + deploy staging
        working-directory: hub/worker
        run: |
          pnpm exec wrangler d1 migrations apply DB --env staging --remote
          pnpm exec wrangler deploy --env staging
      - name: wait for healthz
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://staging-hub.shiroha.tech/healthz && exit 0
            sleep 5
          done
          exit 1

  e2e:
    needs: staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      HUB_URL: https://staging-hub.shiroha.tech
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hub/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            hub/e2e/playwright-report
            hub/e2e/test-results
          retention-days: 7

  production:
    needs: e2e
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hub/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hub/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: hub/web/dist
      - name: migrate + deploy production
        working-directory: hub/worker
        run: |
          pnpm exec wrangler d1 migrations apply DB --env production --remote
          pnpm exec wrangler deploy --env production
      - run: curl -fsS https://hub.shiroha.tech/healthz
# Failure mail: GitHub emails the pusher when a workflow run fails (default notification setting).
