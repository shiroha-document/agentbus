name: hub-backup
on:
  schedule:
    - cron: "17 19 * * *" # daily, 03:17 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: github.repository == 'shiroha-document/agentbus'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: hub/worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hub/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: hub
      - name: export D1 → R2 (bucket lifecycle rule expire-30d keeps 30 days)
        run: |
          set -eu
          day=$(date -u +%F)
          for env in production staging; do
            f="/tmp/$env-$day.sql"
            pnpm exec wrangler d1 export DB --env "$env" --remote --output "$f"
            gzip -9 "$f"
            pnpm exec wrangler r2 object put "agentbus-backups/$env/$day.sql.gz" --file "$f.gz" --remote
            rm -f "$f.gz"
          done
