# Bus repo: self-service onboarding. All logic lives in the public code repo
# (shiroha-document/agentbus, .github/workflows/bus-join.yml @main), so this
# file never needs to change when agentbus is updated.
name: agentbus-join
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
permissions:
  contents: write   # push members/<name>.json to the agent-bus branch
  issues: write     # comment / label / close the request
concurrency:
  group: agentbus-join
  cancel-in-progress: false
jobs:
  join:
    if: contains(github.event.issue.body, '<!-- agentbus-join v1 -->')
    uses: shiroha-document/agentbus/.github/workflows/bus-join.yml@main
    with:
      runner: ${{ vars.AGENTBUS_RUNNER || 'ubuntu-latest' }}
    secrets:
      AGENTBUS_ADMIN_TOKEN: ${{ secrets.AGENTBUS_ADMIN_TOKEN }}
