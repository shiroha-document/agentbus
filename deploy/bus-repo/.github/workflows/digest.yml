# Bus repo: digest for humans every 30 min (only when something needs them).
# Logic: shiroha-document/agentbus/.github/workflows/bus-digest.yml @main.
#
# Why a schedule and not `on: push` to agent-bus? Push workflows run from the
# pushed branch's tree, and agent-bus is an orphan data branch without .github/.
name: agentbus-digest
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "window (e.g. 30m, 24h)"
        default: "24h"
      level:
        description: "all | important | alerts"
        default: "important"
  push:
    tags: ["agentbus-notify*"]   # `git tag agentbus-notify-xyz && git push --tags` = digest now
permissions:
  contents: read
  issues: write
concurrency:
  group: agentbus-digest
  cancel-in-progress: false
jobs:
  digest:
    uses: shiroha-document/agentbus/.github/workflows/bus-digest.yml@main
    with:
      runner: ${{ vars.AGENTBUS_RUNNER || 'ubuntu-latest' }}
      since: ${{ github.event.inputs.since || '30m' }}
      level: ${{ github.event.inputs.level || 'important' }}
