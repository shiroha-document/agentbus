<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="same-origin" />
    <meta name="theme-color" content="#f7fbf9" />
    <meta name="application-name" content="agentbus" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="agentbus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- use-credentials: the whole hub sits behind Cloudflare Access, which needs the cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Sets <html data-theme> before first paint. External, not inline: the CSP is script-src 'self'. -->
    <script src="/theme-init.js"></script>
    <title>agentbus hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
